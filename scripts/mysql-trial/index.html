<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ทดลอง MySQL • Office System</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font:16px system-ui;padding:24px}main{max-width:420px;margin:24px auto;background:white;padding:24px;border-radius:24px}label{display:block;margin:16px 0 8px}input,button{font:inherit;width:100%;padding:14px;border-radius:12px;border:1px solid #ddd}button{background:#2563eb;color:white;cursor:pointer;margin-top:16px;border:0}button:disabled{opacity:.5}p{line-height:1.6}small{color:#64748b}.badge{background:#fef3c7;padding:12px;border-radius:12px}pre{white-space:pre-wrap;font:14px system-ui;background:#f4f6f9;padding:12px;border-radius:12px}#status{min-height:24px}</style><main><h1>ทดลอง MySQL</h1><p class="badge">ข้อมูลทดลองแยกจากระบบหลัก<br>ไม่มีการอ่านหรือเขียน Supabase</p><form id="login"><label for="username">ชื่อผู้ใช้ทดลอง</label><input id="username" value="demo001" autocomplete="username"><label for="password">รหัสผ่านทดลอง</label><input id="password" value="TrialOnly-2026!" type="password" autocomplete="current-password"><small>มี demo001–demo200 ใช้รหัสผ่านทดลองเดียวกัน</small><button>เข้าสู่ระบบทดลอง</button></form><section id="work" hidden><p id="welcome"></p><button id="save">บันทึกเวลาเข้างานทดลอง</button><button id="refresh">ดูข้อมูลของฉัน</button><pre id="records"></pre><button id="logout">ออกจากระบบ</button></section><p id="status" role="status"></p><small>บัญชีผูกกับเบราว์เซอร์แรกที่ลงชื่อ ข้อมูลทั้งหมดเป็นข้อมูลสาธิต</small></main><script>
const $=id=>document.getElementById(id);async function api(path,body){const response=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error);return data;}
async function run(fn){document.querySelectorAll('button').forEach(b=>b.disabled=true);$('status').textContent='กำลังดำเนินการ…';try{await fn();$('status').textContent='สำเร็จ';}catch(error){$('status').textContent=error.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
async function refresh(){const data=await api('/attendance');$('records').textContent=data.records.length?data.records.map(r=>r.work_date+' • '+r.check_in_time+' UTC').join('\n'):'ยังไม่มีรายการทดลอง';}
$('login').onsubmit=e=>{e.preventDefault();run(async()=>{const username=$('username').value.trim().toLowerCase(),key='mysql_trial_device:'+username;let deviceToken=localStorage.getItem(key);if(!deviceToken){deviceToken=crypto.randomUUID();localStorage.setItem(key,deviceToken);}const data=await api('/login',{username,password:$('password').value,deviceToken});$('welcome').textContent='ลงชื่อแล้ว: '+data.username;$('login').hidden=true;$('work').hidden=false;await refresh();});};$('save').onclick=()=>run(async()=>{await api('/attendance',{});await refresh();});$('refresh').onclick=()=>run(refresh);$('logout').onclick=()=>run(async()=>{await api('/logout',{});$('work').hidden=true;$('login').hidden=false;});
</script></html>
